  <path d="M-20 275 C 40 250, 100 275, 160 220 C 200 185, 230 195, 260 175" stroke="url(#waveGrad2)" stroke-width="1.6" fill="none" opacity="0.6"/>
  <path d="M-20 240 C 35 210, 95 235, 155 180 C 195 145, 225 155, 260 135" stroke="url(#waveGrad2)" stroke-width="1.4" fill="none" opacity="0.45"/>
  <path d="M-20 205 C 30 170, 90 195, 150 140 C 190 105, 220 115, 260 95" stroke="url(#waveGrad2)" stroke-width="1.2" fill="none" opacity="0.3"/>
